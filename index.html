<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>دفتر الأقساط</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#FAF6EE; --paper-dim:#F2ECDF; --ink:#20303D; --ink-soft:#5B6B77; --ink-faint:#93A0A9;
    --rule:#DCD2BC; --rule-strong:#C9BC9E; --brass:#B2802C; --brass-bg:#F3E6CC;
    --green:#2E6B52; --green-bg:#E1EEE5; --red:#AF3E30; --red-bg:#F6E3DF;
    --card:#FFFDF8; --navy:#1C2B38; --navy-ink:#13202B; --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Segoe UI', Tahoma, Geneva, Arial, sans-serif; height:100%;}
  body{display:flex; justify-content:center;}
  #app{width:100%; max-width:480px; min-height:100vh; background:var(--paper);
    display:flex; flex-direction:column; position:relative;}
  .display{font-weight:700; letter-spacing:.3px;}

  /* ---- Auth screen ---- */
  .auth-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 24px;}
  .auth-logo{text-align:center; margin-bottom:28px;}
  .auth-logo h1{font-size:28px; margin:0; color:var(--navy);}
  .auth-logo p{font-size:13px; color:var(--ink-soft); margin:6px 0 0;}
  .auth-tabs{display:flex; background:var(--paper-dim); border-radius:10px; padding:4px; margin-bottom:20px;}
  .auth-tab{flex:1; text-align:center; padding:10px; border-radius:8px; font-size:14px; font-weight:600;
    color:var(--ink-soft); cursor:pointer;}
  .auth-tab.active{background:var(--navy); color:#fff;}
  .auth-err{background:var(--red-bg); color:var(--red); font-size:13px; padding:9px 12px; border-radius:8px;
    margin-bottom:12px; display:none;}
  .auth-err.show{display:block;}

  /* ---- Top bar ---- */
  .topbar{background:var(--navy); color:#fff; padding:22px 18px 18px;
    border-bottom:3px solid var(--brass); position:sticky; top:0; z-index:20;}
  .topbar-row{display:flex; align-items:center; justify-content:space-between;}
  .topbar h1{margin:0; font-size:24px; letter-spacing:.3px;}
  .topbar p{margin:4px 0 0; font-size:12px; color:#B9C3CB;}
  .icon-btn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
    color:#fff; width:38px; height:38px; border-radius:10px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; flex-shrink:0;}
  .icon-btn svg{width:18px; height:18px;}
  .topbar-actions{display:flex; gap:8px;}

  .stats{display:flex; background:var(--navy-ink); color:#fff; margin-top:14px; border-radius:10px; overflow:hidden;}
  .stat{flex:1; text-align:center; padding:12px 6px; border-left:1px solid rgba(255,255,255,.12);}
  .stat:last-child{border-left:none;}
  .stat b{display:block; font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat b.warn{color:#E3B26A;} .stat b.danger{color:#E58C7D;}
  .stat span{display:block; font-size:10.5px; color:#9FACB6; margin-top:2px;}

  .search-wrap{padding:14px 16px 6px;}
  .search-box{display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--rule); border-radius:10px; padding:9px 12px;}
  .search-box svg{width:17px; height:17px; color:var(--ink-faint); flex-shrink:0;}
  .search-box input{border:none; outline:none; background:transparent; font-family:inherit;
    font-size:14.5px; color:var(--ink); width:100%;}

  .list{padding:4px 16px 110px;}
  .row{display:flex; background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    margin-bottom:9px; overflow:hidden; cursor:pointer;}
  .row:active{background:var(--paper-dim);}
  .row-bar{width:5px; flex-shrink:0;}
  .row-bar.ok{background:var(--green);} .row-bar.due{background:var(--brass);} .row-bar.late{background:var(--red);}
  .row-body{flex:1; padding:11px 13px; min-width:0;}
  .row-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .row-name{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-amount{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0;}
  .row-amount.ok{color:var(--green);} .row-amount.due{color:var(--brass);} .row-amount.late{color:var(--red);}
  .row-sub{display:flex; justify-content:space-between; align-items:center; margin-top:4px;}
  .row-model{font-size:12px; color:var(--ink-soft);}
  .row-badge{font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600;}
  .row-badge.ok{background:var(--green-bg); color:var(--green);}
  .row-badge.due{background:var(--brass-bg); color:var(--brass);}
  .row-badge.late{background:var(--red-bg); color:var(--red);}

  .empty{text-align:center; padding:60px 20px; color:var(--ink-faint);}
  .empty svg{width:46px; height:46px; margin-bottom:10px; opacity:.5;}
  .empty p{font-size:13.5px; margin:0;}

  .fab{position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    max-width:448px; width:calc(100% - 32px); z-index:25;}
  .fab button{width:100%; background:var(--navy); color:#fff; border:none; border-radius:12px;
    padding:14px; font-family:inherit; font-size:15px; font-weight:600; display:flex; align-items:center;
    justify-content:center; gap:8px; box-shadow:0 6px 20px rgba(28,43,56,.35); cursor:pointer;}
  .fab svg{width:18px; height:18px;}

  .sheet-overlay{position:fixed; inset:0; background:rgba(20,30,38,.45); z-index:40; display:none; justify-content:center;}
  .sheet-overlay.show{display:flex;}
  .sheet{width:100%; max-width:480px; background:var(--paper); margin-top:auto; border-radius:18px 18px 0 0;
    max-height:92vh; overflow-y:auto;}
  .sheet-head{position:sticky; top:0; background:var(--navy); color:#fff; padding:16px 16px 14px;
    display:flex; align-items:center; gap:10px; border-bottom:3px solid var(--brass); z-index:2;}
  .sheet-head h2{font-size:17px; margin:0; font-weight:700; flex:1;}
  .sheet-body{padding:18px 16px 28px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field input, .field select{width:100%; border:1px solid var(--rule-strong); border-radius:9px;
    padding:11px 12px; font-family:inherit; font-size:14.5px; background:var(--card); color:var(--ink); outline:none;}
  .field input:focus, .field select:focus{border-color:var(--brass);}
  .field-row{display:flex; gap:10px;} .field-row .field{flex:1;}
  .preview{background:var(--brass-bg); border:1px dashed var(--brass); border-radius:9px; padding:10px 12px;
    font-size:13px; color:#7A5A1E; margin:4px 0 16px; display:flex; justify-content:space-between;}
  .preview b{font-variant-numeric:tabular-nums;}

  .btn-primary{width:100%; background:var(--navy); color:#fff; border:none; border-radius:10px;
    padding:13px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer;}
  .btn-primary:disabled{opacity:.6;}
  .btn-danger{width:100%; background:var(--red-bg); color:var(--red); border:1px solid var(--red);
    border-radius:10px; padding:12px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; margin-top:10px;}
  .btn-link{background:none; border:none; color:var(--ink-soft); font-size:13px; text-decoration:underline;
    cursor:pointer; width:100%; margin-top:14px; font-family:inherit;}

  .d-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .d-item{background:var(--card); border:1px solid var(--rule); border-radius:9px; padding:10px 12px;}
  .d-item span{display:block; font-size:11px; color:var(--ink-faint); margin-bottom:3px;}
  .d-item b{font-size:15.5px; font-variant-numeric:tabular-nums;}
  .d-item.full{grid-column:1/-1; display:flex; justify-content:space-between; align-items:center;}
  .status-pill{display:inline-block; padding:4px 12px; border-radius:20px; font-size:12.5px; font-weight:700;}
  .status-pill.ok{background:var(--green-bg); color:var(--green);}
  .status-pill.due{background:var(--brass-bg); color:var(--brass);}
  .status-pill.late{background:var(--red-bg); color:var(--red);}

  .section-label{font-size:11px; color:var(--ink-faint); margin:16px 2px 6px; font-weight:600;}
  .ledger{border:1px solid var(--rule); border-radius:9px; overflow:hidden; margin:14px 0;}
  .ledger-row{display:flex; align-items:center; padding:9px 12px; border-bottom:1px solid var(--rule); font-size:13px;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row.head{background:var(--paper-dim); font-weight:700; color:var(--ink-soft); font-size:11.5px;}
  .ledger-row span:first-child{width:28px; color:var(--ink-faint); flex-shrink:0;}
  .ledger-row span.date{flex:1;}
  .ledger-row span.amt{width:80px; text-align:left; font-variant-numeric:tabular-nums; font-weight:600;}
  .ledger-row span.amt.paid{color:var(--green);} .ledger-row span.amt.pending{color:var(--ink-faint);}

  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--navy-ink);
    color:#fff; padding:10px 20px; border-radius:30px; font-size:13px; z-index:60; opacity:0;
    transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
  .loading{text-align:center; padding:50px; color:var(--ink-faint); font-size:13px;}
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="bootLoading">جاري التحميل…</div>
</div>

<script>
(function(){
  "use strict";

  // ===== Supabase project config =====
  var SUPABASE_URL = "https://zufqnxsldcitkglagwqz.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1ZnFueHNsZGNpdGtnbGFnd3F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MjE3NTYsImV4cCI6MjEwNzE5Nzc1Nn0.hVPpNiBLkDEDqhkxswLvgNeBnTced5tZoDcs0iJWS5c";
  var EMAIL_DOMAIN = "@installments-atfeh.app";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var app = document.getElementById('app');
  var customers = []; // {id,name,phone,model,price,down,count,freq,firstDue,payments:[{id,date,amount}]}
  var activeId = null;
  var currentUser = null;

  function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function fmt(n){ n = Math.round(n||0); return n.toLocaleString('en-US'); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function addMonths(iso, months){ var d=new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+months); return d.toISOString().slice(0,10); }
  function addPeriod(iso, n, freq){
    if(freq==='weekly'){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n*7); return d.toISOString().slice(0,10); }
    return addMonths(iso, n);
  }
  function freqLabel(f){ return f==='weekly' ? 'أسبوعي' : 'شهري'; }
  function arDate(iso){
    if(!iso) return '—';
    var months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    var d=new Date(iso+'T00:00:00');
    return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
  function normalizePhone(p){ return (p||'').trim().replace(/[^0-9]/g,''); }
  function phoneToEmail(p){ return normalizePhone(p) + EMAIL_DOMAIN; }

  function derive(c){
    var funded = c.price - c.down;
    var monthly = c.count>0 ? funded/c.count : 0;
    var paidCount = c.payments.length;
    var collected = c.payments.reduce(function(s,p){return s+p.amount;},0);
    var remaining = funded - collected;
    var completed = paidCount >= c.count;
    var nextDue = completed ? null : addPeriod(c.firstDue, paidCount, c.freq||'monthly');
    var status = completed ? 'ok' : (nextDue && nextDue < todayISO() ? 'late' : 'due');
    return {funded:funded, monthly:monthly, paidCount:paidCount, collected:collected, remaining:remaining,
      completed:completed, nextDue:nextDue, status:status};
  }
  function statusLabel(s){ return s==='ok' ? 'مكتمل' : (s==='late' ? 'متأخر' : 'منتظم'); }

  function toast(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  /* ================= AUTH SCREEN ================= */
  function renderAuth(mode){
    mode = mode || 'login';
    app.innerHTML =
      '<div class="auth-wrap">'+
        '<div class="auth-logo"><h1 class="display">دفتر الأقساط</h1><p>متابعة بيع الموبايلات بالتقسيط</p></div>'+
        '<div class="auth-tabs">'+
          '<div class="auth-tab '+(mode==='login'?'active':'')+'" data-mode="login">تسجيل دخول</div>'+
          '<div class="auth-tab '+(mode==='signup'?'active':'')+'" data-mode="signup">حساب جديد</div>'+
        '</div>'+
        '<div class="auth-err" id="authErr"></div>'+
        '<div class="field"><label>رقم الموبايل</label><input id="a_phone" type="tel" placeholder="01xxxxxxxxx" inputmode="numeric"></div>'+
        '<div class="field"><label>كلمة السر</label><input id="a_pass" type="password" placeholder="6 أحرف على الأقل"></div>'+
        (mode==='signup' ? '<div class="field"><label>تأكيد كلمة السر</label><input id="a_pass2" type="password"></div>' : '')+
        '<button class="btn-primary" id="authBtn">'+(mode==='login'?'دخول':'إنشاء الحساب')+'</button>'+
      '</div>'+
      '<div class="toast" id="toast"></div>';

    Array.prototype.forEach.call(app.querySelectorAll('.auth-tab'), function(t){
      t.addEventListener('click', function(){ renderAuth(t.getAttribute('data-mode')); });
    });

    document.getElementById('authBtn').addEventListener('click', async function(){
      var btn = this;
      var phone = normalizePhone(document.getElementById('a_phone').value);
      var pass = document.getElementById('a_pass').value;
      var errBox = document.getElementById('authErr');
      errBox.classList.remove('show');

      if(phone.length < 8){ showErr('اكتب رقم موبايل صحيح'); return; }
      if(pass.length < 6){ showErr('كلمة السر لازم 6 أحرف على الأقل'); return; }

      if(mode === 'signup'){
        var pass2 = document.getElementById('a_pass2').value;
        if(pass !== pass2){ showErr('كلمة السر غير متطابقة'); return; }
      }

      btn.disabled = true; btn.textContent = '...جاري المعالجة';
      var email = phoneToEmail(phone);
      try{
        if(mode === 'signup'){
          var res = await sb.auth.signUp({ email: email, password: pass });
          if(res.error) throw res.error;
          if(!res.data.session){
            // email confirmation still on — try signing in anyway (works once confirmation is disabled in dashboard)
            var res2 = await sb.auth.signInWithPassword({ email: email, password: pass });
            if(res2.error) throw res2.error;
          }
        } else {
          var r = await sb.auth.signInWithPassword({ email: email, password: pass });
          if(r.error) throw r.error;
        }
        await boot();
      }catch(e){
        btn.disabled = false; btn.textContent = (mode==='login'?'دخول':'إنشاء الحساب');
        var msg = (e && e.message) || 'حصل خطأ، حاول تاني';
        if(msg.indexOf('Invalid login') !== -1) msg = 'رقم الموبايل أو كلمة السر غلط';
        if(msg.indexOf('already registered') !== -1 || msg.indexOf('already exists') !== -1) msg = 'الرقم ده مسجل بالفعل، جرّب تسجيل الدخول';
        showErr(msg);
      }
    });

    function showErr(msg){
      var e = document.getElementById('authErr');
      e.textContent = msg; e.classList.add('show');
    }
  }

  /* ================= DATA LOAD ================= */
  async function loadData(){
    var custRes = await sb.from('customers').select('*').order('created_at', {ascending:false});
    if(custRes.error){ toast('تعذر تحميل البيانات: '+custRes.error.message); return; }
    var payRes = await sb.from('payments').select('*');
    if(payRes.error){ toast('تعذر تحميل الدفعات: '+payRes.error.message); return; }

    var paymentsByCustomer = {};
    (payRes.data||[]).forEach(function(p){
      (paymentsByCustomer[p.customer_id] = paymentsByCustomer[p.customer_id] || []).push({
        id: p.id, date: p.paid_date, amount: parseFloat(p.amount)
      });
    });
    customers = (custRes.data||[]).map(function(c){
      return {
        id: c.id, name: c.name, phone: c.phone, model: c.model,
        price: parseFloat(c.price), down: parseFloat(c.down_payment),
        count: c.installments_count, freq: c.freq, firstDue: c.first_due_date,
        payments: (paymentsByCustomer[c.id]||[]).sort(function(a,b){ return a.date < b.date ? -1 : 1; })
      };
    });
  }

  /* ================= MAIN APP SHELL ================= */
  function renderShell(){
    app.innerHTML =
      '<div class="topbar">'+
        '<div class="topbar-row">'+
          '<div><h1 class="display">دفتر الأقساط</h1><p>متابعة بيع الموبايلات بالتقسيط</p></div>'+
          '<div class="topbar-actions">'+
            '<button class="icon-btn" id="refreshBtn" title="تحديث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>'+
            '<button class="icon-btn" id="logoutBtn" title="خروج"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>'+
          '</div>'+
        '</div>'+
        '<div class="stats"><div class="stat"><b id="statCount">0</b><span>عميل</span></div>'+
        '<div class="stat"><b id="statDue" class="warn">0</b><span>متوقع الشهر</span></div>'+
        '<div class="stat"><b id="statLate" class="danger">0</b><span>متأخر</span></div></div>'+
      '</div>'+
      '<div class="search-wrap"><div class="search-box">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'+
        '<input id="searchInput" type="text" placeholder="ابحث بالاسم أو رقم التليفون"></div></div>'+
      '<div class="list" id="listWrap"><div class="loading">جاري التحميل…</div></div>'+
      '<div class="fab"><button id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>إضافة عميل جديد</button></div>'+
      '<div class="sheet-overlay" id="addOverlay"><div class="sheet"><div class="sheet-head">'+
        '<button class="icon-btn" id="closeAdd" style="background:transparent;border:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>'+
        '<h2>إضافة عميل جديد</h2></div><div class="sheet-body">'+
        '<div class="field"><label>اسم العميل</label><input id="f_name" type="text" placeholder="مثال: أحمد محمد علي"></div>'+
        '<div class="field-row"><div class="field"><label>رقم التليفون</label><input id="f_phone" type="tel" placeholder="01xxxxxxxxx"></div>'+
        '<div class="field"><label>موديل الموبايل</label><input id="f_model" type="text" placeholder="Samsung A15"></div></div>'+
        '<div class="field-row"><div class="field"><label>السعر الكاش</label><input id="f_price" type="number" inputmode="decimal" placeholder="12000"></div>'+
        '<div class="field"><label>المقدم</label><input id="f_down" type="number" inputmode="decimal" placeholder="3000"></div></div>'+
        '<div class="field-row"><div class="field"><label>عدد الأقساط</label><input id="f_count" type="number" inputmode="numeric" placeholder="6"></div>'+
        '<div class="field"><label>تاريخ أول قسط</label><input id="f_firstdue" type="date"></div></div>'+
        '<div class="field"><label>دورية السداد</label><select id="f_freq"><option value="monthly">شهري</option><option value="weekly">أسبوعي</option></select></div>'+
        '<div class="preview" id="livePreview"><span>المبلغ الممول: <b id="pv_funded">0</b> ج</span><span>قيمة كل قسط: <b id="pv_monthly">0</b> ج <span id="pv_freq_label"></span></span></div>'+
        '<button class="btn-primary" id="saveBtn">حفظ العميل</button>'+
      '</div></div></div>'+
      '<div class="sheet-overlay" id="detailOverlay"><div class="sheet"><div class="sheet-head">'+
        '<button class="icon-btn" id="closeDetail" style="background:transparent;border:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>'+
        '<h2 id="d_title">—</h2></div><div class="sheet-body" id="detailBody"></div></div></div>'+
      '<div class="toast" id="toast"></div>';

    document.getElementById('refreshBtn').addEventListener('click', async function(){ await loadData(); render(); toast('تم التحديث'); });
    document.getElementById('logoutBtn').addEventListener('click', async function(){
      if(!confirm('تسجيل الخروج؟')) return;
      await sb.auth.signOut();
      renderAuth('login');
    });
    document.getElementById('searchInput').addEventListener('input', render);

    var addOverlay = document.getElementById('addOverlay');
    document.getElementById('addBtn').addEventListener('click', function(){
      ['f_name','f_phone','f_model','f_price','f_down','f_count'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('f_firstdue').value = todayISO();
      document.getElementById('f_freq').value = 'monthly';
      updatePreview();
      addOverlay.classList.add('show');
    });
    document.getElementById('closeAdd').addEventListener('click', function(){ addOverlay.classList.remove('show'); });
    addOverlay.addEventListener('click', function(e){ if(e.target===addOverlay) addOverlay.classList.remove('show'); });

    function updatePreview(){
      var price = parseFloat(document.getElementById('f_price').value)||0;
      var down = parseFloat(document.getElementById('f_down').value)||0;
      var count = parseInt(document.getElementById('f_count').value)||0;
      var freq = document.getElementById('f_freq').value;
      var funded = Math.max(price-down,0);
      var monthly = count>0 ? funded/count : 0;
      document.getElementById('pv_funded').textContent = fmt(funded);
      document.getElementById('pv_monthly').textContent = fmt(monthly);
      document.getElementById('pv_freq_label').textContent = '/ '+(freq==='weekly'?'أسبوعيًا':'شهريًا');
    }
    ['f_price','f_down','f_count','f_freq'].forEach(function(id){
      document.getElementById(id).addEventListener('input', updatePreview);
      document.getElementById(id).addEventListener('change', updatePreview);
    });

    document.getElementById('saveBtn').addEventListener('click', async function(){
      var btn = this;
      var name = document.getElementById('f_name').value.trim();
      var phone = document.getElementById('f_phone').value.trim();
      var model = document.getElementById('f_model').value.trim();
      var price = parseFloat(document.getElementById('f_price').value)||0;
      var down = parseFloat(document.getElementById('f_down').value)||0;
      var count = parseInt(document.getElementById('f_count').value)||0;
      var firstDue = document.getElementById('f_firstdue').value || todayISO();
      var freq = document.getElementById('f_freq').value;

      if(!name){ toast('اكتب اسم العميل'); return; }
      if(price<=0 || count<=0){ toast('اكتب السعر وعدد الأقساط'); return; }

      btn.disabled = true;
      var ins = await sb.from('customers').insert({
        user_id: currentUser.id, name:name, phone:phone, model:model, price:price,
        down_payment:down, installments_count:count, first_due_date:firstDue, freq:freq
      }).select().single();
      btn.disabled = false;
      if(ins.error){ toast('تعذر الحفظ: '+ins.error.message); return; }

      customers.unshift({ id:ins.data.id, name:name, phone:phone, model:model, price:price, down:down,
        count:count, freq:freq, firstDue:firstDue, payments:[] });
      render();
      addOverlay.classList.remove('show');
      toast('تم حفظ العميل');
    });

    var detailOverlay = document.getElementById('detailOverlay');
    document.getElementById('closeDetail').addEventListener('click', function(){ detailOverlay.classList.remove('show'); });
    detailOverlay.addEventListener('click', function(e){ if(e.target===detailOverlay) detailOverlay.classList.remove('show'); });

    render();
  }

  function computeStats(){
    var count = customers.length, dueThisMonth=0, late=0;
    var now=new Date(), curMonth=now.getMonth(), curYear=now.getFullYear();
    customers.forEach(function(c){
      var d = derive(c);
      if(d.status==='late') late++;
      if(!d.completed && d.nextDue){
        var nd = new Date(d.nextDue+'T00:00:00');
        if(nd.getMonth()===curMonth && nd.getFullYear()===curYear) dueThisMonth += d.monthly;
      }
    });
    document.getElementById('statCount').textContent = count;
    document.getElementById('statDue').textContent = fmt(dueThisMonth);
    document.getElementById('statLate').textContent = late;
  }

  function render(){
    computeStats();
    var wrap = document.getElementById('listWrap');
    var q = document.getElementById('searchInput').value.trim();
    var list = customers.filter(function(c){ return !q || c.name.indexOf(q)!==-1 || (c.phone||'').indexOf(q)!==-1; });
    var order = {late:0, due:1, ok:2};
    list = list.slice().sort(function(a,b){ return order[derive(a).status]-order[derive(b).status]; });

    if(list.length===0){
      wrap.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>'+
        '<p>'+(customers.length===0?'لسه مفيش عملاء — ابدأ بإضافة أول عميل':'مفيش نتائج مطابقة للبحث')+'</p></div>';
      return;
    }
    wrap.innerHTML = list.map(function(c){
      var d = derive(c);
      var amountText = d.completed ? 'مكتمل' : fmt(d.remaining)+' ج';
      return '<div class="row" data-id="'+c.id+'"><div class="row-bar '+d.status+'"></div><div class="row-body">'+
        '<div class="row-top"><div class="row-name">'+escapeHtml(c.name)+'</div><div class="row-amount '+d.status+'">'+amountText+'</div></div>'+
        '<div class="row-sub"><div class="row-model">'+escapeHtml(c.model||'')+' · قسط '+Math.min(d.paidCount+(d.completed?0:1),c.count)+'/'+c.count+'</div>'+
        '<div class="row-badge '+d.status+'">'+statusLabel(d.status)+'</div></div></div></div>';
    }).join('');

    Array.prototype.forEach.call(wrap.querySelectorAll('.row'), function(el){
      el.addEventListener('click', function(){ openDetail(el.getAttribute('data-id')); });
    });
  }

  function openDetail(id){
    activeId = id;
    renderDetail();
    document.getElementById('detailOverlay').classList.add('show');
  }

  function renderDetail(){
    var c = customers.find(function(x){ return x.id===activeId; });
    if(!c) return;
    var d = derive(c);
    document.getElementById('d_title').textContent = c.name;

    var rows = '';
    for(var i=0;i<c.count;i++){
      var paid = c.payments[i];
      var dueDate = addPeriod(c.firstDue, i, c.freq||'monthly');
      rows += '<div class="ledger-row"><span>'+(i+1)+'</span><span class="date">'+
        (paid ? arDate(paid.date) : arDate(dueDate)+' (متوقع)')+'</span>'+
        '<span class="amt '+(paid?'paid':'pending')+'">'+(paid?fmt(paid.amount):'—')+'</span></div>';
    }

    var body = document.getElementById('detailBody');
    body.innerHTML =
      '<div class="d-grid">'+
        '<div class="d-item"><span>موديل الموبايل</span><b>'+escapeHtml(c.model||'—')+'</b></div>'+
        '<div class="d-item"><span>رقم التليفون</span><b>'+escapeHtml(c.phone||'—')+'</b></div>'+
        '<div class="d-item"><span>السعر الكاش</span><b>'+fmt(c.price)+' ج</b></div>'+
        '<div class="d-item"><span>المقدم</span><b>'+fmt(c.down)+' ج</b></div>'+
        '<div class="d-item"><span>المبلغ الممول</span><b>'+fmt(d.funded)+' ج</b></div>'+
        '<div class="d-item"><span>قيمة القسط</span><b>'+fmt(d.monthly)+' ج</b></div>'+
        '<div class="d-item"><span>دورية السداد</span><b>'+freqLabel(c.freq||'monthly')+'</b></div>'+
        '<div class="d-item"><span>المحصل</span><b>'+fmt(d.collected)+' ج</b></div>'+
        '<div class="d-item"><span>المتبقي</span><b>'+fmt(d.remaining)+' ج</b></div>'+
        '<div class="d-item full"><span style="margin:0">الحالة — '+(d.completed?'مكتمل':'القسط القادم: '+arDate(d.nextDue))+'</span><span class="status-pill '+d.status+'">'+statusLabel(d.status)+'</span></div>'+
      '</div>'+
      (d.completed ? '' : '<button class="btn-primary" id="payBtn">تسجيل دفع قسط ('+fmt(d.monthly)+' ج)</button>')+
      '<div class="section-label" style="margin-top:18px">سجل الأقساط</div>'+
      '<div class="ledger"><div class="ledger-row head"><span>#</span><span class="date">التاريخ</span><span class="amt">المبلغ</span></div>'+rows+'</div>'+
      '<button class="btn-danger" id="deleteBtn">حذف العميل</button>';

    var payBtn = document.getElementById('payBtn');
    if(payBtn){
      payBtn.addEventListener('click', async function(){
        payBtn.disabled = true;
        var ins = await sb.from('payments').insert({ customer_id:c.id, amount:d.monthly, paid_date:todayISO() }).select().single();
        payBtn.disabled = false;
        if(ins.error){ toast('تعذر التسجيل: '+ins.error.message); return; }
        c.payments.push({ id:ins.data.id, date: ins.data.paid_date, amount: parseFloat(ins.data.amount) });
        render(); renderDetail();
        toast('تم تسجيل القسط');
      });
    }
    document.getElementById('deleteBtn').addEventListener('click', async function(){
      if(!confirm('تأكيد حذف العميل "'+c.name+'"؟ الإجراء ده مش ممكن التراجع عنه.')) return;
      var del = await sb.from('customers').delete().eq('id', c.id);
      if(del.error){ toast('تعذر الحذف: '+del.error.message); return; }
      customers = customers.filter(function(x){ return x.id!==c.id; });
      document.getElementById('detailOverlay').classList.remove('show');
      render();
      toast('تم حذف العميل');
    });
  }

  /* ================= BOOT ================= */
  async function boot(){
    var sess = await sb.auth.getSession();
    var session = sess.data && sess.data.session;
    if(!session){ renderAuth('login'); return; }
    currentUser = session.user;
    app.innerHTML = '<div class="loading">جاري تحميل بياناتك…</div>';
    await loadData();
    renderShell();
  }

  boot();
})();
</script>
</body>
</html>
